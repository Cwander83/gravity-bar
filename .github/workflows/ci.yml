name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (macOS)
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build & Test Swift Package
        run: |
          swift build -v
          swift run GravityBar --test

      - name: Verify App Bundle Packaging
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh
          test -f "dist/GravityBar.app/Contents/MacOS/GravityBar"
          test -f "dist/GravityBar.app/Contents/Info.plist"
          codesign --verify --strict --verbose=2 "dist/GravityBar.app"

